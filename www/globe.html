
<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Global Adhan Clock - Earth</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      background: #07111f;
      font-family: Arial, sans-serif;
      color: white;
    }

    #globe-container {
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    canvas {
      display: block;
    }

    #instruction-panel {
      position: absolute;
      top: 18px;
      left: 18px;
      z-index: 5;
      background: rgba(10, 25, 44, 0.85);
      border: 1px solid rgba(255,255,255,0.15);
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 13px;
      color: #d8e6f5;
      max-width: 260px;
    }

    #city-panel {
      position: absolute;
      right: 18px;
      bottom: 18px;
      z-index: 5;
      width: 270px;
      padding: 18px;
      background: rgba(10, 25, 44, 0.94);
      border: 1px solid rgba(112, 214, 176, 0.45);
      border-radius: 12px;
      display: none;
    }

    #city-panel h3 {
      margin-top: 0;
      margin-bottom: 8px;
      color: #70d6b0;
    }

    #city-panel p {
      color: #d2deed;
      font-size: 13px;
      line-height: 1.6;
      margin: 5px 0;
    }

    #local-clock {
      color: #70d6b0;
      font-size: 17px;
      font-weight: bold;
      margin-top: 12px;
    }

    #close-panel {
      position: absolute;
      top: 8px;
      right: 10px;
      background: transparent;
      color: white;
      border: none;
      font-size: 20px;
      cursor: pointer;
    }

    #selection-status {
      color: #70d6b0;
      font-size: 12px;
      margin-top: 10px;
    }

  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>

</head>


<body>

  <div id="globe-container"></div>


  <div id="instruction-panel">

    <strong>GLOBAL ADHAN CLOCK</strong>

    <p>Drag to rotate Earth.</p>

    <p>Scroll to zoom.</p>

    <p>Click a city marker to explore its local prayer times.</p>

  </div>


  <div id="city-panel">

    <button id="close-panel">×</button>

    <h3 id="city-name">Selected City</h3>

    <p id="city-country"></p>

    <p id="city-coordinates"></p>

    <p id="city-timezone"></p>

    <div id="local-clock"></div>

    <div id="selection-status">
      Location selected
    </div>

  </div>


  <script type="module">

    import * as THREE from "three";

    import { OrbitControls } from
      "three/addons/controls/OrbitControls.js";


    // ========================================================
    // 1. SCENE
    // ========================================================

    const container =
      document.getElementById("globe-container");

    const scene = new THREE.Scene();

    scene.background = new THREE.Color(0x07111f);


    // ========================================================
    // 2. CAMERA
    // ========================================================

    const camera = new THREE.PerspectiveCamera(

      45,

      window.innerWidth / window.innerHeight,

      0.1,

      1000

    );

    camera.position.set(0, 0, 3);


    // ========================================================
    // 3. RENDERER
    // ========================================================

    const renderer = new THREE.WebGLRenderer({

      antialias: true

    });

    renderer.setPixelRatio(
      Math.min(window.devicePixelRatio, 2)
    );

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

    container.appendChild(renderer.domElement);


    // ========================================================
    // 4. LIGHTING
    // ========================================================

    const ambientLight = new THREE.AmbientLight(
      0xffffff,
      1.5
    );

    scene.add(ambientLight);


    const sunlight = new THREE.DirectionalLight(
      0xffffff,
      2
    );

    sunlight.position.set(5, 3, 5);

    scene.add(sunlight);


    // ========================================================
    // 5. ORBIT CONTROLS
    // ========================================================

    const controls = new OrbitControls(
      camera,
      renderer.domElement
    );

    controls.enableDamping = true;

    controls.dampingFactor = 0.05;

    controls.minDistance = 1.5;

    controls.maxDistance = 6;


    // ========================================================
    // 6. EARTH
    // ========================================================

    const earthGeometry = new THREE.SphereGeometry(
      1,
      64,
      64
    );

    const textureLoader = new THREE.TextureLoader();

    const earthTexture = textureLoader.load(
      "/globe/images/earth_texture.jpg"
    );

    const earthMaterial = new THREE.MeshPhongMaterial({

      map: earthTexture,

      shininess: 8

    });

    const earth = new THREE.Mesh(
      earthGeometry,
      earthMaterial
    );

    scene.add(earth);


    // ========================================================
    // 7. LOCATION DATA
    // ========================================================

    // This is the initial demonstration dataset.
    // The next expansion will load the full global dataset
    // rather than manually writing every marker here.

    const cities = [

      {
        location_id: "lagos-nigeria",
        city: "Lagos",
        country: "Nigeria",
        latitude: 6.5244,
        longitude: 3.3792,
        timezone: "Africa/Lagos"
      },

      {
        location_id: "abuja-nigeria",
        city: "Abuja",
        country: "Nigeria",
        latitude: 9.0765,
        longitude: 7.3986,
        timezone: "Africa/Lagos"
      },

      {
        location_id: "london-united-kingdom",
        city: "London",
        country: "United Kingdom",
        latitude: 51.5072,
        longitude: -0.1276,
        timezone: "Europe/London"
      },

      {
        location_id: "tokyo-japan",
        city: "Tokyo",
        country: "Japan",
        latitude: 35.6762,
        longitude: 139.6503,
        timezone: "Asia/Tokyo"
      }

    ];


    // ========================================================
    // 8. COORDINATES TO EARTH POSITION
    // ========================================================

    function geographicToVector(
      latitude,
      longitude,
      radius = 1.015
    ) {

      const phi =
        latitude * Math.PI / 180;

      const lambda =
        longitude * Math.PI / 180;

      const x =
        radius * Math.cos(phi) * Math.sin(lambda);

      const y =
        radius * Math.sin(phi);

      const z =
        radius * Math.cos(phi) * Math.cos(lambda);

      return new THREE.Vector3(x, y, z);

    }


    // ========================================================
    // 9. CITY MARKERS
    // ========================================================

    const markerObjects = [];

    const markerGeometry = new THREE.SphereGeometry(
      0.012,
      12,
      12
    );

    cities.forEach(city => {

      const markerMaterial =
        new THREE.MeshBasicMaterial({
          color: 0xff5555
        });

      const marker = new THREE.Mesh(
        markerGeometry,
        markerMaterial
      );

      marker.position.copy(
        geographicToVector(
          city.latitude,
          city.longitude
        )
      );

      marker.userData.city = city;

      earth.add(marker);

      markerObjects.push(marker);

    });


    // ========================================================
    // 10. CLICK DETECTION
    // ========================================================

    const raycaster = new THREE.Raycaster();

    const mouse = new THREE.Vector2();

    let selectedCity = null;


    // ========================================================
    // 11. SEND LOCATION TO SHINY
    // ========================================================

    function sendLocationToShiny(city) {

      window.parent.postMessage(

        {

          type: "global-adhan-location-selected",

          location: {

            location_id: city.location_id,

            city: city.city,

            country: city.country,

            latitude: city.latitude,

            longitude: city.longitude,

            timezone: city.timezone

          }

        },

        window.location.origin

      );

    }


    // ========================================================
    // 12. LOCAL CLOCK
    // ========================================================

    function updateLocalClock() {

      if (!selectedCity) {
        return;
      }

      const clock = document.getElementById(
        "local-clock"
      );

      const now = new Date();

      try {

        clock.textContent =
          new Intl.DateTimeFormat(

            "en-GB",

            {

              timeZone: selectedCity.timezone,

              weekday: "short",

              year: "numeric",

              month: "short",

              day: "2-digit",

              hour: "2-digit",

              minute: "2-digit",

              second: "2-digit",

              hour12: false

            }

          ).format(now);

      } catch (error) {

        clock.textContent =
          "Local clock unavailable";

      }

    }


    // ========================================================
    // 13. SHOW SELECTED CITY
    // ========================================================

    function showCity(city) {

      selectedCity = city;

      document.getElementById(
        "city-name"
      ).textContent = city.city;

      document.getElementById(
        "city-country"
      ).textContent = city.country;

      document.getElementById(
        "city-coordinates"
      ).textContent =
        "Latitude: " + city.latitude +
        " | Longitude: " + city.longitude;

      document.getElementById(
        "city-timezone"
      ).textContent =
        "Timezone: " + city.timezone;

      document.getElementById(
        "city-panel"
      ).style.display = "block";

      updateLocalClock();

      sendLocationToShiny(city);

    }


    // ========================================================
    // 14. HANDLE MARKER CLICKS
    // ========================================================

    renderer.domElement.addEventListener(
      "click",
      function(event) {

        const bounds =
          renderer.domElement.getBoundingClientRect();

        mouse.x =
          ((event.clientX - bounds.left) /
            bounds.width) * 2 - 1;

        mouse.y =
          -((event.clientY - bounds.top) /
            bounds.height) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);

        const intersections =
          raycaster.intersectObjects(markerObjects);

        if (intersections.length > 0) {

          const clickedMarker =
            intersections[0].object;

          const city =
            clickedMarker.userData.city;

          showCity(city);

        }

      }
    );


    // ========================================================
    // 15. CLOSE LOCATION PANEL
    // ========================================================

    document.getElementById(
      "close-panel"
    ).addEventListener("click", function() {

      document.getElementById(
        "city-panel"
      ).style.display = "none";

    });


    // ========================================================
    // 16. RESPONSIVE WINDOW
    // ========================================================

    window.addEventListener(
      "resize",
      function() {

        camera.aspect =
          window.innerWidth / window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
          window.innerWidth,
          window.innerHeight
        );

      }
    );


    // ========================================================
    // 17. ANIMATION
    // ========================================================

    function animate() {

      requestAnimationFrame(animate);

      controls.update();

      updateLocalClock();

      renderer.render(scene, camera);

    }

    animate();

  </script>

</body>

</html>
