
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Global Adhan Clock - Interactive Earth</title>

  <!-- Three.js configuration -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
    }
  }
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      background: #050b18;
      font-family: Arial, sans-serif;
    }

    canvas {
      display: block;
    }

    /* City information panel */
    #city-panel {
      position: absolute;
      top: 20px;
      left: 20px;
      width: 260px;
      padding: 20px;
      background: rgba(8, 20, 40, 0.92);
      color: white;
      border: 1px solid rgba(100, 180, 255, 0.3);
      border-radius: 14px;
      display: none;
      z-index: 10;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
    }

    #city-panel h2 {
      margin: 0 0 15px;
      color: #62c5ff;
    }

    #city-panel p {
      font-size: 13px;
      line-height: 1.7;
      margin: 5px 0;
    }

    #close-panel {
      position: absolute;
      top: 10px;
      right: 12px;
      background: none;
      border: none;
      color: white;
      font-size: 20px;
      cursor: pointer;
    }

    #instructions {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      background: rgba(8, 20, 40, 0.8);
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 12px;
      text-align: center;
      pointer-events: none;
      width: max-content;
      max-width: 90%;
    }
  </style>

</head>

<body>

  <!-- City information panel -->
  <div id="city-panel">

    <button id="close-panel" aria-label="Close panel">×</button>

    <h2 id="city-name">City</h2>

    <p id="city-country"></p>
    <p id="city-latitude"></p>
    <p id="city-longitude"></p>
    <p id="city-timezone"></p>

  </div>

  <div id="instructions">
    Drag to rotate Earth · Scroll to zoom · Click a city marker
  </div>

  <script type="module">

    import * as THREE from
      "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

    import { OrbitControls } from
      "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js";


    // ==========================================
    // 1. CREATE THE SCENE
    // ==========================================

    const scene = new THREE.Scene();

    scene.background = new THREE.Color(0x050b18);


    // ==========================================
    // 2. CREATE THE CAMERA
    // ==========================================

    const camera = new THREE.PerspectiveCamera(
      45,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );

    camera.position.set(0, 0, 3);


    // ==========================================
    // 3. CREATE THE RENDERER
    // ==========================================

    const renderer = new THREE.WebGLRenderer({
      antialias: true
    });

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

    renderer.setPixelRatio(
      Math.min(window.devicePixelRatio, 2)
    );

    renderer.outputColorSpace = THREE.SRGBColorSpace;

    document.body.appendChild(renderer.domElement);


    // ==========================================
    // 4. CREATE THE EARTH
    // ==========================================

    const earthGeometry = new THREE.SphereGeometry(
      1,
      96,
      96
    );

    const earthMaterial = new THREE.MeshBasicMaterial({
      color: 0xffffff
    });

    const earth = new THREE.Mesh(
      earthGeometry,
      earthMaterial
    );

    scene.add(earth);


    // ==========================================
    // 5. LOAD THE EARTH TEXTURE
    // ==========================================

    const textureLoader = new THREE.TextureLoader();

    textureLoader.load(

      "/globe/images/earth_texture.jpg",

      function(texture) {

        // Correct image colour space
        texture.colorSpace = THREE.SRGBColorSpace;

        // Allow horizontal wrapping
        texture.wrapS = THREE.RepeatWrapping;

        // Align Greenwich with longitude 0
        texture.offset.x = 0.25;

        // Apply texture to Earth
        earth.material.map = texture;

        earth.material.needsUpdate = true;

        console.log("Earth texture loaded successfully!");

      },

      undefined,

      function(error) {

        console.error(
          "Could not load Earth texture:",
          error
        );

      }

    );


    // ==========================================
    // 6. CITY DATA
    // ==========================================

    const cityLocations = [

      {
        name: "Lagos",
        country: "Nigeria",
        latitude: 6.5244,
        longitude: 3.3792,
        timezone: "Africa/Lagos"
      },

      {
        name: "Abuja",
        country: "Nigeria",
        latitude: 9.0765,
        longitude: 7.3986,
        timezone: "Africa/Lagos"
      },

      {
        name: "London",
        country: "United Kingdom",
        latitude: 51.5072,
        longitude: -0.1276,
        timezone: "Europe/London"
      },

      {
        name: "Tokyo",
        country: "Japan",
        latitude: 35.6762,
        longitude: 139.6503,
        timezone: "Asia/Tokyo"
      }

    ];


    // ==========================================
    // 7. CONVERT LATITUDE AND LONGITUDE TO 3D
    // ==========================================

    function getPosition(latitude, longitude, radius) {

      // Convert latitude to radians
      const phi = latitude * (Math.PI / 180);

      // Convert longitude to radians
      const lambda = longitude * (Math.PI / 180);

      // Corrected geographic orientation
      const x =
        radius * Math.cos(phi) * Math.sin(lambda);

      const y =
        radius * Math.sin(phi);

      const z =
        radius * Math.cos(phi) * Math.cos(lambda);

      return new THREE.Vector3(x, y, z);

    }



// ==========================================
// 8. CREATE ACCURATE LOCATION PIN MARKERS
// ==========================================

const cityMarkers = [];

// Create a canvas for the location pin
const pinCanvas = document.createElement("canvas");

pinCanvas.width = 128;
pinCanvas.height = 160;

const ctx = pinCanvas.getContext("2d");

// Draw the location pin
ctx.beginPath();

ctx.moveTo(64, 150);

ctx.bezierCurveTo(52, 128, 12, 84, 12, 53);
ctx.bezierCurveTo(12, 22, 35, 5, 64, 5);
ctx.bezierCurveTo(93, 5, 116, 22, 116, 53);
ctx.bezierCurveTo(116, 84, 76, 128, 64, 150);

ctx.closePath();

// Pin colour
ctx.fillStyle = "#ff405c";
ctx.fill();

// White outline
ctx.lineWidth = 7;
ctx.strokeStyle = "#ffffff";
ctx.stroke();

// White circle inside pin
ctx.beginPath();

ctx.arc(64, 53, 19, 0, Math.PI * 2);

ctx.fillStyle = "#ffffff";
ctx.fill();

// Convert canvas into Three.js texture
const pinTexture = new THREE.CanvasTexture(pinCanvas);

pinTexture.colorSpace = THREE.SRGBColorSpace;

// Create location markers
cityLocations.forEach(city => {

    const pinMaterial = new THREE.SpriteMaterial({

        map: pinTexture,
        transparent: true,
        depthTest: true,
        depthWrite: true

    });

    const marker = new THREE.Sprite(pinMaterial);

    // IMPORTANT:
    // Anchor the bottom tip of the pin to the coordinate
    marker.center.set(0.5, 0.0);

    // Pin dimensions
    marker.scale.set(0.055, 0.070, 1);

    // Calculate exact 3D geographical position
    const cityPosition = getPosition(
        city.latitude,
        city.longitude,
        1.008
    );

    marker.position.copy(cityPosition);

    // Store city information
    marker.userData = city;

    // Attach marker to Earth
    earth.add(marker);

    // Save marker for click detection
    cityMarkers.push(marker);

    console.log(
        "Accurate location pin:",
        city.name,
        city.latitude,
        city.longitude
    );

});



    // ==========================================
    // 9. CREATE ATMOSPHERE
    // ==========================================

    const atmosphereGeometry = new THREE.SphereGeometry(
      1.035,
      64,
      64
    );

    const atmosphereMaterial = new THREE.MeshBasicMaterial({

      color: 0x168cff,

      transparent: true,

      opacity: 0.12,

      side: THREE.BackSide

    });

    const atmosphere = new THREE.Mesh(
      atmosphereGeometry,
      atmosphereMaterial
    );

    earth.add(atmosphere);


    // ==========================================
    // 10. LIGHTING
    // ==========================================

    const sunlight = new THREE.DirectionalLight(
      0xffffff,
      2
    );

    sunlight.position.set(5, 3, 5);

    scene.add(sunlight);

    const ambientLight = new THREE.AmbientLight(
      0xffffff,
      0.25
    );

    scene.add(ambientLight);


    // ==========================================
    // 11. ROTATION AND ZOOM CONTROLS
    // ==========================================

    const controls = new OrbitControls(
      camera,
      renderer.domElement
    );

    controls.enableDamping = true;

    controls.dampingFactor = 0.05;

    controls.enableZoom = true;

    controls.minDistance = 1.5;

    controls.maxDistance = 8;


    // ==========================================
    // 12. CLICKABLE CITY MARKERS
    // ==========================================

    const raycaster = new THREE.Raycaster();

    const mouse = new THREE.Vector2();

    const cityPanel = document.getElementById("city-panel");

    renderer.domElement.addEventListener(
      "click",
      function(event) {

        const bounds =
          renderer.domElement.getBoundingClientRect();

        mouse.x =
          ((event.clientX - bounds.left) / bounds.width) * 2 - 1;

        mouse.y =
          -((event.clientY - bounds.top) / bounds.height) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);

        const intersections = raycaster.intersectObjects(
          cityMarkers,
          false
        );

        if (intersections.length > 0) {

          const selectedCity =
            intersections[0].object.userData;

          document.getElementById("city-name").textContent =
            selectedCity.name;

          document.getElementById("city-country").textContent =
            "Country: " + selectedCity.country;

          document.getElementById("city-latitude").textContent =
            "Latitude: " + selectedCity.latitude + "°";

          document.getElementById("city-longitude").textContent =
            "Longitude: " + selectedCity.longitude + "°";

          document.getElementById("city-timezone").textContent =
            "Time zone: " + selectedCity.timezone;

          cityPanel.style.display = "block";

        }

      }
    );


    // ==========================================
    // 13. CLOSE CITY INFORMATION PANEL
    // ==========================================

    document.getElementById("close-panel").addEventListener(
      "click",
      function() {

        cityPanel.style.display = "none";

      }
    );


    // ==========================================
    // 14. ANIMATION LOOP
    // ==========================================

    function animate() {

      requestAnimationFrame(animate);

      controls.update();

      renderer.render(scene, camera);

    }

    animate();


    // ==========================================
    // 15. RESPONSIVE WINDOW
    // ==========================================

    window.addEventListener("resize", function() {

      camera.aspect =
        window.innerWidth / window.innerHeight;

      camera.updateProjectionMatrix();

      renderer.setSize(
        window.innerWidth,
        window.innerHeight
      );

      renderer.setPixelRatio(
        Math.min(window.devicePixelRatio, 2)
      );

    });

  </script>

</body>

</html>
